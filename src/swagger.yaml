openapi: 3.0.0
info:
  title: Node.js REST API Demo
  version: 1.0.0
  description: A world-class Node.js REST API demonstrating best practices.
servers:
  - url: http://127.0.0.1:9000
paths:
  /api/destination:
    get:
      summary: Retrieve a list of destinations
      parameters:
        - in: query
          name: count
          schema:
            type: integer
          description: Number of destinations to return
        - in: query
          name: country
          schema:
            type: string
          description: Filter by country
      responses:
        '200':
          description: A JSON array of destinations
    post:
      summary: Create a new destination
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                city:
                  type: string
                description:
                  type: string
                country:
                  type: string
      responses:
        '201':
          description: Destination created successfully
  /api/destination/{id}:
    get:
      summary: Get a destination by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Destination object
        '404':
          description: Destination not found
    put:
      summary: Update a destination
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                city:
                  type: string
                description:
                  type: string
                country:
                  type: string
      responses:
        '200':
          description: Destination updated
        '404':
          description: Destination not found
    delete:
      summary: Delete a destination
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Destination deleted
        '404':
          description: Destination not found
  /api/students:
    get:
      summary: Get all students from MSSQL Database
      responses:
        '200':
          description: A list of students
